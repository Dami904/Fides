name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # No secrets are needed or used: live tests are skipped unless FIDES_LIVE is set, and the default suite runs on a simulated world.
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
